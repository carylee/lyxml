[package]
name = "lyxml"
version = "0.1.0"
edition = "2021"
description = "Fast, faithful conversion between MusicXML and LilyPond"
license = "MIT"

[workspace]

[dependencies]
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
